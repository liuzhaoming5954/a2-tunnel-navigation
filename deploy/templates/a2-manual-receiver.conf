[Unit]
# 保留原单元对锁存、ready 和启动入口的全部检查。拒绝复用指向别处的运行目录。
ConditionPathIsSymbolicLink=!/run/a2-manual

[Service]
EnvironmentFile=/etc/a2/remote-stop.env
PrivateTmp=yes
# 固定版本接收器和与守护同版的 SDK 均位于 /opt/a2，服务内挂载为只读。
ReadOnlyPaths=/opt/a2
# 系统管理器只在原有启动条件通过后执行此步。目录的 setgid 让套接字继承网关组，
# 网关能连接但不能创建、替换或删除套接字。真实发令进程仍使用原单元的普通账号。
ExecStartPre=+/usr/bin/install -d -o a2-autonomy -g unitree -m 2750 /run/a2-manual
