name: repository-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        # actions/checkout v4, resolved from the upstream tag on 2026-11-04.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate repository scaffolding
        run: python3 scripts/check_repository.py
      - name: Install diagnostic test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-yaml
      - name: Test capture, map and diagnostic tools
        run: /usr/bin/python3 -m unittest discover -s scripts/test -v
      - name: Test SQLite journal
        env:
          PYTHONPATH: src/a2_storage
        run: python3 -m unittest discover -s src/a2_storage/test -v
      - name: Test offline mission core
        env:
          PYTHONPATH: src/a2_storage:src/a2_mission
        run: python3 -m unittest discover -s src/a2_mission/test -v
      - name: Run synthetic mission demo
        env:
          PYTHONPATH: src/a2_storage:src/a2_mission
        run: python3 -m a2_mission.demo
      - name: Test mock bringup configuration
        env:
          PYTHONPATH: src/a2_bringup
        run: python3 -m unittest discover -s src/a2_bringup/test -v
      - name: Test offline map planning and single-goal navigation
        env:
          PYTHONPATH: src/a2_navigation
        run: /usr/bin/python3 -m unittest discover -s src/a2_navigation/test -v
      - name: Test maintenance motion arbitration
        env:
          PYTHONPATH: src/a2_safety
        run: python3 -m unittest discover -s src/a2_safety/test -v
      - name: Test patrol and single-goal gateway over loopback
        env:
          PYTHONPATH: src/a2_gateway:src/a2_navigation
        run: /usr/bin/python3 -m unittest discover -s src/a2_gateway/test -v
      # These checks do not grant robot motion authorization.
